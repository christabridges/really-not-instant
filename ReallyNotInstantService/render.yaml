version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: really-not-instant
      runtime: docker
      repo: https://github.com/cBridges851/really-not-instant
      plan: free
      envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: reallynotinstantservice_db
          property: connectionString
      - key: OPEN_ROUTE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      region: frankfurt
      dockerContext: .
      dockerfilePath: ReallyNotInstantService/Dockerfile
      autoDeployTrigger: commit
      rootDir: ReallyNotInstantService
    databases:
      - name: reallynotinstantservice_db
        plan: free
        region: frankfurt
