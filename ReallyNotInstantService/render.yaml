version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: really-not-instant
      runtime: docker
      repo: https://github.com/cBridges851/really-not-instant
      plan: free
      envVars:
      - key: POSTGRES_CONNECTION_STRING
        fromDatabase:
          name: really-not-instant-service-db
          property: connectionString
      - key: OPEN_ROUTE_SERVICE_KEY
        sync: false
      region: frankfurt
      dockerContext: .
      dockerfilePath: ReallyNotInstantService/Dockerfile
      autoDeployTrigger: commit
      rootDir: ReallyNotInstantService
    databases:
      name: really-not-instant-service-db
      plan: free
