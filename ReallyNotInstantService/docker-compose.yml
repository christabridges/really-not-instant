services:
  reallynotinstantservice:
    image: ${DOCKER_REGISTRY-}reallynotinstantservice
    environment:
      - ConnectionStrings__DefaultConnection=${POSTGRES_CONNECTION_STRING}
      - OPEN_ROUTE_SERVICE_KEY=${OPEN_ROUTE_SERVICE_KEY}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT} 
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    build:
      context: .
      dockerfile: ReallyNotInstantService/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"     

  reallynotinstantservice_db:
    image: postgres:latest
    container_name: reallynotinstantservice_db
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - 5050:80
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

volumes:
  postgres_data: